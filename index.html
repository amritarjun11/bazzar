    <script>
      // Suppress Vite HMR WebSocket notices in dev/preview environments
      (function() {
        var origError = console.error;
        var origWarn = console.warn;
        var origDebug = console.debug;
        function isViteWs(args) {
          var str = '';
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            str += ' ' + String(item && item.message ? item.message : item);
          }
          return str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('[vite]') !== -1;
        }
        console.error = function() {
          if (isViteWs(arguments)) return;
          origError.apply(console, arguments);
        };
        console.warn = function() {
          if (isViteWs(arguments)) return;
          origWarn.apply(console, arguments);
        };
        console.debug = function() {
          if (isViteWs(arguments)) return;
          origDebug.apply(console, arguments);
        };
      })();

      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason) || '';
        var msg = String(reason.message || reason || '');
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('websocket') !== -1 ||
          msg.indexOf('vite') !== -1 ||
          msg.indexOf('Failed to fetch') !== -1 ||
          msg.indexOf('Load failed') !== -1 ||
          msg.indexOf('NetworkError') !== -1
        ) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return false;
        }
      }, true);
      window.addEventListener('error', function(e) {
        var msg = String((e && e.message) || '');
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('websocket') !== -1 ||
          msg.indexOf('vite') !== -1 ||
          msg.indexOf('Failed to fetch') !== -1 ||
          msg.indexOf('Load failed') !== -1 ||
          msg.indexOf('NetworkError') !== -1
        ) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return false;
        }
      }, true);

      // Defense against environments where window.fetch has only a getter
      // Prevents: "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var customFetch = nativeFetch;
          function getFetch() {
            return customFetch || nativeFetch;
          }
          function setFetch(val) {
            customFetch = val;
          }

          try {
            Object.defineProperty(window, 'fetch', {
              get: getFetch,
              set: setFetch,
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              if (window.Window && Window.prototype) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: getFetch,
                  set: setFetch,
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e2) {}
          }

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: getFetch,
                set: setFetch,
                configurable: true,
                enumerable: true
              });
            } catch (e3) {}
          }
        } catch (err) {}
      })();
    </script>
